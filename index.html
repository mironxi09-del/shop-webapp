<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... ваш CSS ... */
        .copy-btn {
            background: #6c757d;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            margin-top: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .copy-btn:active { opacity: 0.7; }
    </style>
</head>
<body>
    <!-- ... ваш HTML ... -->
    <div id="statusMessage" class="status-message">✅ Заказ сформирован! <br> Нажмите "Открыть чат" или скопируйте текст вручную.</div>
    <button class="copy-btn" id="copyMessage">📋 Скопировать текст заказа</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe?.user || {};
        const defaultName = user.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : '';

        // ⚠️ ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ЮЗЕРНЕЙМ ВАШЕГО БОТА (без @)
        const botUsername = 'MySuperShopBot'; 

        console.log('🤖 Юзернейм бота:', botUsername);

        // ... остальной код (каталог, категории, форма) ...

        document.getElementById('submitOrder').addEventListener('click', function() {
            const name = document.getElementById('nameInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            if (!name || !address || !email) {
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
            if (!selectedItem) {
                alert('Ошибка: товар не выбран.');
                return;
            }
            const message = `🛍 ЗАКАЗ
        Товар: ${selectedItem.name}
        Цена: ${selectedItem.price}
        Имя: ${name}
        Адрес: ${address}
        Email: ${email}`;

            // Сохраняем текст в глобальную переменную для кнопки копирования
            window.lastOrderMessage = message;

            // Открываем чат с ботом
            const url = `https://t.me/${botUsername}?text=${encodeURIComponent(message)}`;
            console.log('🔗 Открываем ссылку:', url);
            tg.openTelegramLink(url);

            // Показываем статус и кнопку копирования
            document.getElementById('statusMessage').style.display = 'block';
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('copyMessage').style.display = 'block';
        });

        // Кнопка копирования
        document.getElementById('copyMessage').addEventListener('click', function() {
            if (window.lastOrderMessage) {
                navigator.clipboard.writeText(window.lastOrderMessage).then(() => {
                    alert('✅ Текст заказа скопирован! Вставьте его в чат с ботом.');
                }).catch(() => {
                    // Fallback для старых браузеров
                    const textarea = document.createElement('textarea');
                    textarea.value = window.lastOrderMessage;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ Текст заказа скопирован!');
                });
            }
        });
    </script>
</body>
</html>
