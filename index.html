<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; }
        .category-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .category-btn { background: var(--tg-theme-button-color, #2481cc); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
        .products { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .product-card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; padding: 12px; text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 16px; margin: 8px 0; }
        .product-card p { font-size: 14px; opacity: 0.8; }
        .product-card .price { font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }
        .order-btn { background: var(--tg-theme-button-color, #2481cc); color: #fff; border: none; padding: 8px; border-radius: 8px; margin-top: 8px; cursor: pointer; width: 100%; }
        .order-form { display: none; margin-top: 20px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); padding: 16px; border-radius: 12px; }
        .order-form input, .order-form textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #000; }
        .order-form button { background: var(--tg-theme-button-color, #2481cc); color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 8px; cursor: pointer; }
        .status-message { margin-top: 16px; padding: 12px; background: #d4edda; color: #155724; border-radius: 8px; display: none; }
        .error-message { margin-top: 16px; padding: 12px; background: #f8d7da; color: #721c24; border-radius: 8px; display: none; }
        .close-btn { background: #6c757d; margin-top: 8px; }
        label { font-weight: bold; display: block; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🛍 Каталог</h2>
        <div class="category-list" id="categories"></div>
        <div id="products-container"></div>
        <div class="order-form" id="orderForm">
            <h3>Оформление заказа</h3>
            <p id="orderSummary"></p>
            <label>Ваше имя</label>
            <input type="text" id="nameInput" placeholder="Иван Иванов" />
            <label>Адрес доставки</label>
            <textarea id="addressInput" placeholder="Город, улица, дом, квартира"></textarea>
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="example@mail.com" />
            <button id="submitOrder">Отправить заказ</button>
            <button onclick="closeOrderForm()" class="close-btn">Отмена</button>
        </div>
        <div id="statusMessage" class="status-message">✅ Заказ отправлен!</div>
        <div id="errorMessage" class="error-message">❌ Заполните все поля.</div>
        <button onclick="tg.close()" style="margin-top: 20px; background: #dc3545; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%;">Закрыть магазин</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Данные пользователя Telegram (имя, юзернейм)
        const user = tg.initDataUnsafe?.user || {};
        const defaultName = user.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : '';

        // Расширенный каталог (5 категорий по 4 товара)
        const catalog = {
            "Кофты": [
                { name: "Свитер оверсайз", price: "2 500 ₽", desc: "Тёплый, мягкий, серый", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" },
                { name: "Худи с капюшоном", price: "3 200 ₽", desc: "Чёрное, принт NY", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=300" },
                { name: "Кардиган", price: "4 100 ₽", desc: "Бежевый, пуговицы", img: "https://images.unsplash.com/photo-1544701557-f7d4b8a2f9f2?w=300" },
                { name: "Водолазка", price: "2 800 ₽", desc: "Тёмно-синяя, тонкая", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ],
            "Футболки": [
                { name: "Белая классика", price: "1 200 ₽", desc: "Хлопок 100%", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300" },
                { name: "Поло с воротником", price: "1 800 ₽", desc: "Тёмно-синий", img: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=300" },
                { name: "Футболка с принтом", price: "1 500 ₽", desc: "Чёрная, надпись Vintage", img: "https://images.unsplash.com/photo-1554568218-0f1715e72254?w=300" },
                { name: "Лонгслив", price: "1 900 ₽", desc: "Белый, длинный рукав", img: "https://images.unsplash.com/photo-1558618666-fcd25c85f5c5?w=300" }
            ],
            "Штаны": [
                { name: "Джинсы прямые", price: "3 500 ₽", desc: "Синие, средняя посадка", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" },
                { name: "Карго", price: "4 200 ₽", desc: "Хаки, много карманов", img: "https://images.unsplash.com/photo-1517433670267-08bbd4be890f?w=300" },
                { name: "Спортивные штаны", price: "2 800 ₽", desc: "Чёрные, утеплённые", img: "https://images.unsplash.com/photo-1558618666-fcd25c85f5c5?w=300" },
                { name: "Чинос", price: "3 900 ₽", desc: "Бежевые, классические", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ],
            "Обувь": [
                { name: "Кеды белые", price: "3 900 ₽", desc: "Классические, кожа", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" },
                { name: "Ботинки зимние", price: "6 200 ₽", desc: "Чёрные, на шнуровке", img: "https://images.unsplash.com/photo-1549923746-c502d488b3ea?w=300" },
                { name: "Кроссовки", price: "5 500 ₽", desc: "Серые, беговая подошва", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" },
                { name: "Сандалии", price: "2 300 ₽", desc: "Кожаные, летние", img: "https://images.unsplash.com/photo-1549923746-c502d488b3ea?w=300" }
            ],
            "Аксессуары": [
                { name: "Сумка через плечо", price: "2 500 ₽", desc: "Чёрная, кожа", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=300" },
                { name: "Ремень классический", price: "1 200 ₽", desc: "Чёрный, пряжка", img: "https://images.unsplash.com/photo-1517433670267-08bbd4be890f?w=300" },
                { name: "Шарф", price: "900 ₽", desc: "Серый, шерсть", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" },
                { name: "Перчатки", price: "700 ₽", desc: "Чёрные, кожа", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ]
        };

        let selectedItem = null;

        // Рендерим категории
        const categoriesDiv = document.getElementById('categories');
        Object.keys(catalog).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.textContent = cat;
            btn.onclick = () => showCategory(cat);
            categoriesDiv.appendChild(btn);
        });

        function showCategory(category) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            const items = catalog[category] || [];
            const grid = document.createElement('div');
            grid.className = 'products';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <p class="price">${item.price}</p>
                    <button class="order-btn" onclick="startOrder('${item.name}', '${item.price}')">🛍 Заказать</button>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
            document.getElementById('statusMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function startOrder(name, price) {
            selectedItem = { name, price };
            const form = document.getElementById('orderForm');
            document.getElementById('orderSummary').textContent = `Товар: ${name} (${price})`;
            form.style.display = 'block';
            document.getElementById('products-container').style.display = 'none';
            document.getElementById('statusMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            // Подставляем имя пользователя, если поле пусто
            if (!document.getElementById('nameInput').value && defaultName) {
                document.getElementById('nameInput').value = defaultName;
            }
            document.getElementById('addressInput').focus();
        }

        function closeOrderForm() {
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('products-container').style.display = 'grid';
            selectedItem = null;
        }

        // Обработка отправки заказа
        document.getElementById('submitOrder').addEventListener('click', function() {
            const name = document.getElementById('nameInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            if (!name || !address || !email) {
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
            if (!selectedItem) {
                alert('Ошибка: товар не выбран.');
                return;
            }
            const data = {
                item: selectedItem.name,
                price: selectedItem.price,
                name: name,
                address: address,
                email: email
            };
            console.log('Отправляем данные в бота:', data);
            tg.sendData(JSON.stringify(data));
            document.getElementById('statusMessage').style.display = 'block';
            document.getElementById('orderForm').style.display = 'none';
            // WebApp остаётся открытым, чтобы пользователь увидел статус
        });
    </script>
</body>
</html>
