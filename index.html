<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== CSS-переменные для темы ===== */
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #555;
            --border: #e0e4e8;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --primary: #2a7de1;
            --primary-gradient: linear-gradient(135deg, #2a7de1, #6c5ce7);
            --radius: 16px;
            --transition: 0.3s ease;
        }
        body.dark {
            --bg: #1a1a2e;
            --card-bg: #2a2a3e;
            --text: #f0f0f0;
            --text-secondary: #aaa;
            --border: #3a3a4e;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --primary: #4a8df7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
        }
        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            transition: all var(--transition);
        }
        .theme-toggle:hover { transform: scale(1.05); }
        .cart-icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
            transition: transform var(--transition);
        }
        .cart-icon:hover { transform: scale(1.1); }
        .cart-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #dc3545;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        /* Категории */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text);
        }
        .category-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .category-btn:active { transform: scale(0.95); }
        /* Товары */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .product-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            background: var(--bg);
        }
        .product-card h3 { font-size: 15px; margin: 8px 0 4px; }
        .product-card .desc { font-size: 12px; opacity: 0.7; }
        .product-card .price { font-size: 16px; font-weight: 700; color: var(--primary); margin: 6px 0; }
        .product-card .add-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 0;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .product-card .add-btn:active { opacity: 0.7; }
        /* Корзина (выпадашка) */
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .cart-popup {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
        .cart-popup h2 { margin-bottom: 12px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item .remove {
            color: #dc3545;
            cursor: pointer;
            font-weight: 700;
            margin-left: 8px;
        }
        .cart-total { font-weight: 700; margin-top: 12px; }
        .cart-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .cart-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .cart-actions .checkout { background: var(--primary); color: #fff; }
        .cart-actions .close-cart { background: var(--border); color: var(--text); }
        /* Форма заказа */
        .order-form {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 16px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }
        .order-form h3 { margin-bottom: 12px; }
        .order-form label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
        .order-form input, .order-form textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            resize: vertical;
        }
        .order-form input:focus, .order-form textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42,125,225,0.2);
        }
        .form-actions { display: flex; gap: 10px; margin-top: 16px; }
        .form-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .form-actions .submit { background: var(--primary); color: #fff; }
        .form-actions .cancel { background: var(--border); color: var(--text); }
        .error-message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #f8d7da;
            color: #721c24;
            display: none;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .result-box .order-text {
            background: var(--bg);
            padding: 14px;
            border-radius: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 12px 0;
            border: 1px solid var(--border);
        }
        .result-box .copy-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        .close-app {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (max-width: 400px) { .products { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div class="header">
            <h1>🛍 Каталог</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <div class="cart-icon" id="cartIcon">
                    🛒
                    <span class="cart-badge" id="cartBadge">0</span>
                </div>
            </div>
        </div>

        <!-- Категории -->
        <div class="categories" id="categories"></div>

        <!-- Товары -->
        <div id="products-container"></div>

        <!-- Выпадающая корзина -->
        <div class="cart-overlay" id="cartOverlay">
            <div class="cart-popup">
                <h2>🛒 Корзина</h2>
                <div id="cartItems"></div>
                <div class="cart-total" id="cartTotal">Итого: 0 ₽</div>
                <div class="cart-actions">
                    <button class="checkout" id="checkoutBtn">✅ Оформить заказ</button>
                    <button class="close-cart" id="closeCartBtn">✖ Закрыть</button>
                </div>
            </div>
        </div>

        <!-- Форма заказа -->
        <div class="order-form" id="orderForm">
            <h3>Оформление заказа</h3>
            <p id="orderSummary"></p>
            <label>Ваше имя</label>
            <input type="text" id="nameInput" placeholder="Иван Иванов" />
            <label>Адрес доставки</label>
            <textarea id="addressInput" rows="3" placeholder="Город, улица, дом, квартира"></textarea>
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="example@mail.com" />
            <div class="form-actions">
                <button class="cancel" id="cancelOrderForm">Отмена</button>
                <button class="submit" id="submitOrder">✅ Оформить</button>
            </div>
        </div>

        <!-- Блок результата (после оформления) -->
        <div class="result-box" id="resultBox">
            <div style="font-weight:500;margin-bottom:8px;">📋 Скопируйте текст и отправьте его в чат с ботом:</div>
            <div class="order-text" id="orderTextPreview"></div>
            <button class="copy-btn" id="copyOrderBtn">📋 Скопировать заказ</button>
        </div>

        <div id="errorMessage" class="error-message">❌ Заполните все поля.</div>
        <button class="close-app" onclick="tg.close()">✖ Закрыть магазин</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe?.user || {};
        const defaultName = user.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : '';

        // ===== ТЕМА =====
        const themeToggle = document.getElementById('themeToggle');
        // Проверяем сохранённую тему
        let darkMode = localStorage.getItem('theme') === 'dark';
        if (darkMode) {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            themeToggle.textContent = darkMode ? '☀️' : '🌙';
            localStorage.setItem('theme', darkMode ? 'dark' : 'light');
        });

        // ===== КАТАЛОГ =====
        const catalog = {
            "Кофты": [
                { name: "Свитер оверсайз", price: "2 500 ₽", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" },
                { name: "Худи с капюшоном", price: "3 200 ₽", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=300" },
                { name: "Кардиган", price: "4 100 ₽", img: "https://images.unsplash.com/photo-1544701557-f7d4b8a2f9f2?w=300" },
                { name: "Водолазка", price: "2 800 ₽", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ],
            "Футболки": [
                { name: "Белая классика", price: "1 200 ₽", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300" },
                { name: "Поло", price: "1 800 ₽", img: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=300" },
                { name: "С принтом", price: "1 500 ₽", img: "https://images.unsplash.com/photo-1554568218-0f1715e72254?w=300" },
                { name: "Лонгслив", price: "1 900 ₽", img: "https://images.unsplash.com/photo-1558618666-fcd25c85f5c5?w=300" }
            ],
            "Штаны": [
                { name: "Джинсы", price: "3 500 ₽", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" },
                { name: "Карго", price: "4 200 ₽", img: "https://images.unsplash.com/photo-1517433670267-08bbd4be890f?w=300" },
                { name: "Спортивные", price: "2 800 ₽", img: "https://images.unsplash.com/photo-1558618666-fcd25c85f5c5?w=300" },
                { name: "Чинос", price: "3 900 ₽", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ],
            "Обувь": [
                { name: "Кеды", price: "3 900 ₽", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" },
                { name: "Ботинки", price: "6 200 ₽", img: "https://images.unsplash.com/photo-1549923746-c502d488b3ea?w=300" },
                { name: "Кроссовки", price: "5 500 ₽", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" },
                { name: "Сандалии", price: "2 300 ₽", img: "https://images.unsplash.com/photo-1549923746-c502d488b3ea?w=300" }
            ],
            "Аксессуары": [
                { name: "Сумка", price: "2 500 ₽", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=300" },
                { name: "Ремень", price: "1 200 ₽", img: "https://images.unsplash.com/photo-1517433670267-08bbd4be890f?w=300" },
                { name: "Шарф", price: "900 ₽", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" },
                { name: "Перчатки", price: "700 ₽", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" }
            ]
        };

        // ===== КОРЗИНА =====
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.textContent = totalItems;
            // Обновляем отображение корзины, если она открыта
            renderCartPopup();
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            saveCart();
            // Анимация (мигание)
            const icon = document.getElementById('cartIcon');
            icon.style.transform = 'scale(1.3)';
            setTimeout(() => icon.style.transform = 'scale(1)', 300);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function clearCart() {
            cart = [];
            saveCart();
        }

        // ===== ОТРИСОВКА КОРЗИНЫ В ПОПАПЕ =====
        function renderCartPopup() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<p>Корзина пуста</p>';
                document.getElementById('cartTotal').textContent = 'Итого: 0 ₽';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach((item, idx) => {
                const priceNum = parseInt(item.price.replace(/[^\d]/g, ''));
                const subtotal = priceNum * item.qty;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <span>${item.name} (x${item.qty}) - ${item.price}</span>
                        <span class="remove" data-index="${idx}">✖</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').textContent = `Итого: ${total.toLocaleString('ru-RU')} ₽`;
            // Обработчики удаления
            document.querySelectorAll('.cart-item .remove').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    removeFromCart(idx);
                });
            });
        }

        // ===== ПОКАЗАТЬ/СКРЫТЬ КОРЗИНУ =====
        document.getElementById('cartIcon').addEventListener('click', function() {
            document.getElementById('cartOverlay').style.display = 'flex';
            renderCartPopup();
        });

        document.getElementById('closeCartBtn').addEventListener('click', function() {
            document.getElementById('cartOverlay').style.display = 'none';
        });

        // Закрытие по клику вне попапа
        document.getElementById('cartOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });

        // ===== КАТЕГОРИИ =====
        const categoriesContainer = document.getElementById('categories');
        let activeCategory = Object.keys(catalog)[0];

        function renderCategories() {
            categoriesContainer.innerHTML = '';
            Object.keys(catalog).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn' + (cat === activeCategory ? ' active' : '');
                btn.textContent = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderProducts(cat);
                };
                categoriesContainer.appendChild(btn);
            });
        }

        // ===== ТОВАРЫ =====
        function renderProducts(category) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            const items = catalog[category] || [];
            const grid = document.createElement('div');
            grid.className = 'products';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" loading="lazy">
                    <h3>${item.name}</h3>
                    <div class="price">${item.price}</div>
                    <button class="add-btn" onclick="addToCart('${item.name}', '${item.price}')">🛍 В корзину</button>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
            // Скрываем форму и результат
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
        }

        // ===== ОФОРМЛЕНИЕ ЗАКАЗА =====
        document.getElementById('checkoutBtn').addEventListener('click', function() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }
            // Показываем форму заказа
            document.getElementById('cartOverlay').style.display = 'none';
            const form = document.getElementById('orderForm');
            form.style.display = 'block';
            const itemsStr = cart.map(it => `${it.name} (x${it.qty})`).join(', ');
            document.getElementById('orderSummary').textContent = `Ваш заказ: ${itemsStr}`;
            if (!document.getElementById('nameInput').value && defaultName) {
                document.getElementById('nameInput').value = defaultName;
            }
            document.getElementById('addressInput').focus();
            form.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('cancelOrderForm').addEventListener('click', function() {
            document.getElementById('orderForm').style.display = 'none';
        });

        document.getElementById('submitOrder').addEventListener('click', function() {
            const name = document.getElementById('nameInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            if (!name || !address || !email) {
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
            document.getElementById('errorMessage').style.display = 'none';

            // Формируем текст заказа
            const itemsStr = cart.map(it => `${it.name} (x${it.qty})`).join(', ');
            const total = cart.reduce((sum, it) => {
                const priceNum = parseInt(it.price.replace(/[^\d]/g, ''));
                return sum + priceNum * it.qty;
            }, 0).toLocaleString('ru-RU') + ' ₽';

            const message = `🛍 ЗАКАЗ
        Товары: ${itemsStr}
        Итого: ${total}
        Имя: ${name}
        Адрес: ${address}
        Email: ${email}`;

            // Показываем блок с результатом
            document.getElementById('orderForm').style.display = 'none';
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            document.getElementById('orderTextPreview').textContent = message;

            // Копирование
            document.getElementById('copyOrderBtn').onclick = function() {
                navigator.clipboard.writeText(message).then(() => {
                    alert('✅ Текст скопирован! Отправьте его в чат с ботом.');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = message;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ Текст скопирован!');
                });
            };

            // Очищаем корзину (заказ оформлен)
            clearCart();
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        renderCategories();
        renderProducts(activeCategory);
        updateCartUI();
    </script>
</body>
</html>
